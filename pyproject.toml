[project]
name = "eme-mcp"
version = "0.2.2"
description = "EME (Earth-Moon-Earth) prediction for amateur radio — moon windows, path loss and degradation, computed locally"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Greg Beam, KI7MT", email = "maintainers@qso-graph.io"}]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0,<5",
]
keywords = [
    "amateur-radio", "ham-radio", "qso-graph", "mcp", "model-context-protocol",
    "eme", "moonbounce", "earth-moon-earth", "vhf", "uhf", "weak-signal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://qso-graph.io"
Documentation = "https://qso-graph.io/servers/eme-mcp/"
Repository = "https://github.com/qso-graph/eme-mcp"
Issues = "https://github.com/qso-graph/eme-mcp/issues"

[project.scripts]
eme-mcp = "eme_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eme_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.8",
    "mypy>=1.11",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 95
extend-exclude = [".venv", "dist", "build", ".eggs", ".pytest_cache", "site"]

[tool.ruff.lint]
# F and I are the rules that find defects: an unused import, an undefined name,
# an import block out of order.
#
# E501 is deferred across the fleet (qso-graph-devel#70): what it reports in
# these repos are widths, not defects.
select = ["E", "F", "I"]
fixable = ["I"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
